{% extends "base.html" %}
{% block title %}v2 장면 분석{% endblock %}
{% block content %}
<style>
 .res{display:flex;gap:18px;align-items:center;margin:12px 0;padding:14px 18px;border-radius:12px;background:#1c2638;border:2px solid #33415a}
 .res .lab{font-size:1.8em;font-weight:800}
 .res .dec{font-size:1.05em;font-weight:800;padding:3px 12px;border-radius:14px;color:#0b1220}
 .HEALTHY{color:#4ec26a}.DISEASE{color:#ff6b6b}.CHECK{color:#ffa94d}.RETAKE,.NO_LEAF{color:#adb5bd}
 .bg-HEALTHY{background:#4ec26a}.bg-DISEASE{background:#ff6b6b}.bg-CHECK{background:#ffa94d}.bg-RETAKE,.bg-NO_LEAF{background:#adb5bd}
 .bars{margin:8px 0 12px;max-width:560px}
 .row{display:flex;align-items:center;gap:10px;margin:5px 0}
 .row .n{width:150px}.row .b{height:12px;border-radius:6px;background:#4ec26a}.row .v{width:52px;text-align:right}
 .meta{color:#9aa4b2;font-size:.92em}
 details summary{cursor:pointer;margin-top:12px}
</style>
<section class="panel"><h2>v2 장면 분석: 사진 1장을 분석해 결과 1개로 판정합니다</h2>
<p>근접(잎 1장) = 사진 전체 분류 · 원거리(밭 · 여러 잎) = 사진 일부를 학습 사진처럼 크게 잘라 분류한 뒤 <b>확률을 평균</b> · 평균 점수가 0.5 미만이면 사람 확인 · 흐리거나 어두우면 재촬영</p>
<input id="image" type="file" accept="image/jpeg,image/png,image/webp">
<button id="send">장면 분석</button>
<p id="state">이미지를 선택하세요.</p>
<div id="card"></div>
<div id="bars" class="bars"></div>
<p id="meta" class="meta"></p>
<img id="result" class="preview" hidden>
<details><summary>원본 JSON 보기 (개발자용)</summary><pre id="output">{}</pre></details></section>
<script>
const fileEl=document.getElementById('image');
const KO={HEALTHY:'정상',DISEASE:'병해',CHECK:'사람 확인',RETAKE:'재촬영',NO_LEAF:'잎 없음'};
document.getElementById('send').onclick=async()=>{
 const file=fileEl.files[0];if(!file){alert('이미지를 선택하세요');return;}
 const button=document.getElementById('send');button.disabled=true;
 const state=document.getElementById('state');const out=document.getElementById('output');
 const form=new FormData();form.append('image',file);const started=performance.now();
 state.textContent='분석 중...';
 try{const res=await fetch('/api/v2/classify/?draw=true',{method:'POST',body:form});const data=await res.json();
  state.textContent=`HTTP ${res.status} / 응답까지 ${Math.round(performance.now()-started)}ms`;
  if(res.ok){
   const d=data.decision;
   document.getElementById('card').innerHTML=`<div class="res"><span class="dec bg-${d}">${d} · ${KO[d]||''}</span>`+
     (data.label?`<span class="lab ${d}">${data.label} ${data.score.toFixed(2)}</span>`:'')+`</div>`;
   document.getElementById('bars').innerHTML=(data.all||[]).map(x=>`<div class="row"><span class="n">${x.label}</span>`+
     `<span class="b" style="width:${Math.round(x.score*360)}px"></span><span class="v">${x.score.toFixed(2)}</span></div>`).join('');
   document.getElementById('meta').textContent=`경로 ${data.mode} · ${data.mode==='far'?`${data.parts}조각 평균`:'사진 전체'} · 모델 ${String(data.model_id).split('/').pop()}`+
     (data.inference_ms!=null?` · 추론 ${data.inference_ms}ms`:'');
   if(data.image_jpg_base64){const img=document.getElementById('result');img.src='data:image/jpeg;base64,'+data.image_jpg_base64;img.hidden=false;}
   delete data.image_jpg_base64;
  }
  out.textContent=JSON.stringify(data,null,2);
 }catch(err){state.textContent=`요청 실패: ${err}`;}finally{button.disabled=false;}
};
</script>
{% endblock %}
